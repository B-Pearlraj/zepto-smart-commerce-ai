<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document AI Admin</title><style>body{font:16px system-ui;background:#10121a;color:#f4f4ff;max-width:760px;margin:50px auto;padding:20px}section{background:#202432;border-radius:16px;padding:24px;margin:20px 0}input,button{padding:12px;border-radius:8px;margin:8px 0}input[type=password]{width:95%}button{background:#8256ec;color:white;border:0;cursor:pointer}li{margin:12px 0}small{color:#aaa}</style></head><body><h1>📚 Document AI — Admin</h1><p>Authorized uploads only. Your token stays in this browser tab and is not saved.</p><section><label>Admin token <input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN"></label><button id="init">Initialize vector tables</button></section><section><h2>Upload a document</h2><input id="file" type="file" accept=".pdf,.docx,.txt,.md"><button id="upload">Upload & index</button><p><small>PDF, DOCX, TXT, MD; up to 8 MB by default.</small></p></section><section><h2>Indexed documents</h2><button id="refresh">Refresh list</button><ul id="docs"></ul></section><p id="message" role="status"></p><script>const $=id=>document.getElementById(id);const base=location.origin+'/rag';async function call(path,opts={}){const r=await fetch(base+path,{...opts,headers:{Authorization:'Bearer '+$('token').value,...opts.headers}});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}async function run(fn){try{$('message').textContent='Working…';await fn();$('message').textContent='Completed.'}catch(e){$('message').textContent=e.message}}$('init').onclick=()=>run(()=>call('/admin/init',{method:'POST'}));$('upload').onclick=()=>run(async()=>{const f=$('file').files[0];if(!f)throw Error('Select a file');const fd=new FormData();fd.append('file',f);const r=await call('/admin/upload',{method:'POST',body:fd});$('message').textContent='Indexed '+r.chunks+' chunks';await refresh()});async function refresh(){const data=await call('/admin/documents');$('docs').replaceChildren();for(const d of data.documents){const li=document.createElement('li');li.append(document.createTextNode(`${d.filename} (${d.chunks} chunks) `));const b=document.createElement('button');b.textContent='Delete';b.onclick=()=>{if(confirm('Delete this document?'))run(async()=>{await call('/admin/documents/'+d.id,{method:'DELETE'});await refresh()})};li.append(b);$('docs').append(li)}}$('refresh').onclick=()=>run(refresh);</script></body></html>
