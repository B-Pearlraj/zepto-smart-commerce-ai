<!-- ===== AI Assistant: the ONLY two additions needed in your index.html ===== -->

<!-- 1) Inside <head> (or just before </head>) -->
<link rel="stylesheet" href="chatbot.css">

<!-- 2) Just before </body> -->
<script src="chatbot.js" defer
        data-api="https://YOUR-ASSISTANT-SERVICE.onrender.com"
        data-logo="images/logo.png"></script>

<!--
  data-api   = the Render URL of the assistant service (no trailing slash)
  data-logo  = path to the logo image you already use on the site
               (the round button with the green dot is built from it)
  Copy chatbot.css and chatbot.js into the same folder as index.html.
-->
